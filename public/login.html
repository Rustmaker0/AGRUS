<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Вход / Регистрация — АГРУС</title>
  <link rel="stylesheet" href="/styles.css"/>
  <style>
    .auth-grid { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:14px 16px; align-items:start; }
    .auth-field { min-width:0; display:grid; grid-template-rows:auto 48px 20px; align-content:start; }
    .auth-field label { margin:0 0 8px; min-height:22px; }
    .auth-field input, .auth-field select { min-height:48px; margin:0; }
    .auth-form-error { margin-top:4px; min-height:20px; }
    .auth-help-link { font-weight:700; }
    @media (max-width: 680px){ .auth-grid { grid-template-columns:1fr; } }
  </style>
</head>
<body id="page-login">
  <main class="container" style="max-width:720px">
    <div class="card">
      <div class="card-title">
        <h1 id="authTitle">Вход</h1>
        <button id="toggleMode" class="btn-secondary" type="button">Регистрация</button>
      </div>

      <!-- Форма входа -->
      <form id="loginForm" class="form" novalidate autocomplete="on">
        <div>
          <label for="loginEmail">Email</label>
          <input id="loginEmail" type="email" placeholder="you@example.com" />
          <div id="loginEmailError" class="error"></div>
        </div>
        <div>
          <label for="loginPassword">Пароль</label>
          <input id="loginPassword" type="password" minlength="4" placeholder="••••" />
          <div id="loginPasswordError" class="error"></div>
        </div>
        <div class="row" style="justify-content: flex-end">
          <button id="loginButton" class="btn" type="submit">Войти</button>
        </div>
      </form>

      <!-- Форма регистрации -->
      <form id="registerForm" class="form hidden" novalidate autocomplete="off">
        <div class="auth-grid">
          <div class="auth-field">
            <label for="regName">Имя</label>
            <input id="regName" type="text" placeholder="Иван"/>
            <div id="regNameError" class="error"></div>
          </div>
          <div class="auth-field">
            <label for="regRole">Роль</label>
            <select id="regRole">
              <option value="">— выберите роль —</option>
              <option value="client">Клиент</option>
              <option value="master">Мастер</option>
            </select>
            <div id="regRoleError" class="error"></div>
          </div>
        </div>

        <div>
          <label for="regEmail">Email</label>
          <input id="regEmail" type="email" placeholder="you@example.com" />
          <div id="regEmailError" class="error"></div>
        </div>

        <div class="auth-grid">
          <div class="auth-field">
            <label for="regPassword">Пароль</label>
            <input id="regPassword" type="password" minlength="4" placeholder="••••" />
            <div id="regPasswordError" class="error"></div>
          </div>
          <div class="auth-field">
            <label for="regPassword2">Повтор пароля</label>
            <input id="regPassword2" type="password" minlength="4" placeholder="••••" />
            <div id="regPassword2Error" class="error"></div>
          </div>
        </div>

        <div id="registerFormError" class="error auth-form-error"></div>
        <div class="row" style="justify-content: flex-end">
          <button id="registerButton" class="btn" type="submit">Зарегистрироваться</button>
        </div>
      </form>

      <p class="help" id="authHelp" style="margin-top:8px">Нет аккаунта? Нажмите «Регистрация».</p>
    </div>
  </main>

  <script src="/app.js"></script>
  <script>
    const q = (s) => document.querySelector(s);
    const qa = (s) => document.querySelectorAll(s);
    const MIN_PASSWORD_LENGTH = 4;

    // Функция экранирования HTML (для безопасности)
    function escapeHtml(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function setRegisterFormError(message = "") {
        const errorEl = q("#registerFormError");
        if (errorEl) errorEl.textContent = message;
    }

    function isEmail(str, el) {
        if (!str) return false;
        const v = String(str).trim().toLowerCase().replace(/\s+/g, "");
        const soft = /^[^\s@]+@([^\s@]+\.)+[^\s@]+$/i.test(v);
        if (soft) return true;
        try {
            if (el && typeof el.checkValidity === "function") return el.checkValidity();
        } catch (_) {}
        return false;
    }

    // Валидация имени (безопасная)
    function isValidName(name) {
        if (!name || typeof name !== 'string') return false;
        const trimmed = name.trim();
        if (trimmed.length < 2 || trimmed.length > 100) return false;
        // Разрешаем буквы, пробелы, дефисы и точки
        const nameRegex = /^[а-яА-Яa-zA-Z\s\-.]{2,100}$/u;
        return nameRegex.test(trimmed);
    }

    const $login = q("#loginForm");
    const $register = q("#registerForm");
    const $title = q("#authTitle");
    const $toggle = q("#toggleMode");
    const $help = q("#authHelp");

    function renderHelp(isLogin) {
        if ($help) {
            $help.innerHTML = isLogin
                ? 'Нет аккаунта? Нажмите <a href="?mode=register" class="auth-help-link" data-auth-mode="register">«Регистрация»</a>.'
                : 'Есть аккаунт? Нажмите <a href="?mode=login" class="auth-help-link" data-auth-mode="login">«Вход»</a>.';
        }
    }

    function setMode(mode) {
        const isLogin = mode === "login";
        if ($login) $login.classList.toggle("hidden", !isLogin);
        if ($register) $register.classList.toggle("hidden", isLogin);
        if ($title) $title.textContent = isLogin ? "Вход" : "Регистрация";
        if ($toggle) $toggle.textContent = isLogin ? "Регистрация" : "Вход";
        renderHelp(isLogin);
        
        // Очищаем все ошибки
        qa(".error").forEach(el => {
            if (el) el.textContent = "";
        });
        
        history.replaceState(null, "", isLogin ? "?mode=login" : "?mode=register");
    }

    // Инициализация режима из URL
    const url = new URL(location.href);
    setMode(url.searchParams.get("mode") === "register" ? "register" : "login");

    // Переключение режима
    if ($toggle) {
        $toggle.addEventListener("click", () => {
            const nowLogin = $login && !$login.classList.contains("hidden");
            setMode(nowLogin ? "register" : "login");
        });
    }

    // Обработка кликов по ссылкам в help
    if ($help) {
        $help.addEventListener("click", (e) => {
            const link = e.target.closest("[data-auth-mode]");
            if (!link) return;
            e.preventDefault();
            setMode(link.dataset.authMode);
        });
    }

    // Валидация формы входа
    function showLoginHints(force = false) {
        const emailEl = q("#loginEmail");
        const password = q("#loginPassword")?.value.trim() || "";
        const ok = emailEl && isEmail(emailEl.value, emailEl);
        
        const emailError = q("#loginEmailError");
        const passwordError = q("#loginPasswordError");
        
        if (emailError) {
            emailError.textContent = (!emailEl?.value && !force) || ok ? "" : "Некорректный email";
        }
        if (passwordError) {
            passwordError.textContent = (!password && !force) || password.length >= MIN_PASSWORD_LENGTH ? "" : `Минимум ${MIN_PASSWORD_LENGTH} символов`;
        }
    }

    // Валидация формы регистрации
    function showRegisterHints(force = false) {
        const emailEl = q("#regEmail");
        const ok = emailEl && isEmail(emailEl.value, emailEl);
        const p1 = q("#regPassword")?.value.trim() || "";
        const p2 = q("#regPassword2")?.value.trim() || "";
        const role = q("#regRole")?.value || "";
        const name = q("#regName")?.value.trim() || "";
        
        const emailError = q("#regEmailError");
        const passwordError = q("#regPasswordError");
        const password2Error = q("#regPassword2Error");
        const roleError = q("#regRoleError");
        const nameError = q("#regNameError");
        
        if (emailError) {
            emailError.textContent = (!emailEl?.value && !force) || ok ? "" : "Некорректный email";
        }
        if (passwordError) {
            passwordError.textContent = (!p1 && !force) || p1.length >= MIN_PASSWORD_LENGTH ? "" : `Минимум ${MIN_PASSWORD_LENGTH} символов`;
        }
        if (password2Error) {
            password2Error.textContent = (!p2 && !force) || p1 === p2 ? "" : "Пароли должны совпадать";
        }
        if (roleError) {
            roleError.textContent = role ? "" : (force ? "Выберите роль" : "");
        }
        if (nameError) {
            nameError.textContent = (!name && force) ? "Введите имя" : "";
            if (name && force && !isValidName(name)) {
                nameError.textContent = "Имя должно содержать от 2 до 100 символов (буквы, пробелы, дефисы, точки)";
            }
        }
    }

    // Обработчики ввода
    const loginInputs = ["#loginEmail", "#loginPassword"];
    loginInputs.forEach(sel => {
        const el = q(sel);
        if (el) el.addEventListener("input", () => showLoginHints());
    });

    const registerInputs = ["#regEmail", "#regPassword", "#regPassword2", "#regRole", "#regName"];
    registerInputs.forEach(sel => {
        const el = q(sel);
        if (el) {
            el.addEventListener("input", () => {
                showRegisterHints();
                setRegisterFormError("");
            });
        }
    });

    // ===== ОБРАБОТЧИК ВХОДА (ОБНОВЛЕН) =====
    if ($login) {
        $login.addEventListener("submit", async (e) => {
            e.preventDefault();
            showLoginHints(true);
            
            const emailEl = q("#loginEmail");
            const email = String(emailEl?.value || "").trim().toLowerCase();
            const pass = q("#loginPassword")?.value.trim() || "";
            
            if (!isEmail(email, emailEl) || pass.length < MIN_PASSWORD_LENGTH) return;
            
            try {
                // ВАЖНО: НЕ используем setToken() - токен придет в httpOnly cookie
                const { user } = await API.login(email, pass);
                
                // Редирект в зависимости от роли
                if (user.role === "master") {
                    location.href = "/master.html";
                } else {
                    location.href = "/client.html";
                }
            } catch (err) {
                const emailError = q("#loginEmailError");
                if (emailError) emailError.textContent = "Неверный email или пароль";
                console.error("Login error:", err);
            }
        });
    }

    // ===== ОБРАБОТЧИК РЕГИСТРАЦИИ (ОБНОВЛЕН) =====
    if ($register) {
        $register.addEventListener("submit", async (e) => {
            e.preventDefault();
            showRegisterHints(true);
            
            const emailEl = q("#regEmail");
            const name = q("#regName")?.value.trim() || "";
            const email = String(emailEl?.value || "").trim().toLowerCase();
            const p1 = q("#regPassword")?.value.trim() || "";
            const p2 = q("#regPassword2")?.value.trim() || "";
            const role = q("#regRole")?.value || "";
            
            // Валидация имени
            const isValidNameResult = isValidName(name);
            if (!isValidNameResult) {
                const nameError = q("#regNameError");
                if (nameError) nameError.textContent = "Имя должно содержать от 2 до 100 символов (буквы, пробелы, дефисы, точки)";
                return;
            }
            
            const valid = !!name && isValidNameResult && isEmail(email, emailEl) && 
                         p1.length >= MIN_PASSWORD_LENGTH && p1 === p2 && !!role;
            
            if (!valid) return;
            
            try {
                setRegisterFormError("");
                // Экранируем имя перед отправкой
                const safeName = escapeHtml(name);
                // ВАЖНО: НЕ используем setToken() - токен придет в httpOnly cookie
                const { user } = await API.register({ name: safeName, email, password: p1, role });
                
                // Редирект в зависимости от роли
                if (user.role === "master") {
                    location.href = "/master.html";
                } else {
                    location.href = "/client.html";
                }
            } catch (err) {
                const emailError = q("#regEmailError");
                const passwordError = q("#regPasswordError");
                const roleError = q("#regRoleError");
                
                if (err?.details?.code === "EMAIL_EXISTS") {
                    if (emailError) emailError.textContent = "Почта уже зарегистрирована";
                } else if (err?.details?.code === "PASSWORD_TOO_SHORT") {
                    if (passwordError) passwordError.textContent = `Пароль слишком короткий. Минимум ${MIN_PASSWORD_LENGTH} символов`;
                    setRegisterFormError(`Пароль должен содержать минимум ${MIN_PASSWORD_LENGTH} символов.`);
                } else if (err?.details?.code === "INVALID_ROLE") {
                    if (roleError) roleError.textContent = "Выберите роль";
                } else if (err?.details?.code === "INVALID_NAME") {
                    const nameError = q("#regNameError");
                    if (nameError) nameError.textContent = "Некорректное имя";
                } else {
                    setRegisterFormError(err?.message || "Ошибка регистрации");
                }
                console.error("Registration error:", err);
            }
        });
    }
  </script>
</body>
</html>
