<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Оформление услуги — АГРУС</title>
  <link rel="stylesheet" href="/styles.css"/>
  <style>
    .svc-wrap { display:grid; grid-template-columns: 1.15fr .85fr; gap:16px; }
    @media (max-width: 1000px){ .svc-wrap{ grid-template-columns:1fr; } }

    /* Календарь месяца */
    .cal { background:#fff; border:1px solid var(--border); border-radius:14px; box-shadow: var(--shadow); padding:12px; }
    .cal-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; }
    .cal-title { font-weight:800; }
    .cal-grid { display:grid; grid-template-columns: repeat(7, 1fr); gap:6px; }
    .cal-dow { text-align:center; color:var(--muted); font-size:.9rem; }
    .cal-cell { position:relative; aspect-ratio: 1 / 1; border:1px solid var(--border); border-radius:10px;
                display:flex; align-items:flex-start; justify-content:flex-end; padding:6px; cursor:pointer; background:#fff; }
    .cal-cell .num { font-weight:700; }
    .cal-cell:hover { outline:2px solid var(--focus); z-index:1; }
    .cal-cell.disabled { background:#f1f5f9; color:#94a3b8; cursor:not-allowed; }
    .cal-cell.busy { background:#fee2e2; border-color:#fecaca; }
    .cal-cell.partial { background:#e0f2fe; border-color:#bae6fd; }
    .cal-legend { display:flex; gap:10px; flex-wrap:wrap; margin-top:8px; }
    .cal-dot { width:12px; height:12px; border-radius:3px; display:inline-block; border:1px solid var(--border); }
    .lg-free { background:#fff; }
    .lg-partial { background:#e0f2fe; border-color:#bae6fd; }
    .lg-busy { background:#fee2e2; border-color:#fecaca; }
    .lg-off { background:#f1f5f9; }

    /* Слоты дня */
    .day-panel { background:#fff; border:1px solid var(--border); border-radius:14px; box-shadow: var(--shadow); padding:12px; }
    .slots { 
      display:grid; 
      grid-template-columns: repeat(auto-fill, minmax(130px,1fr)); 
      gap:8px; 
      margin-top:8px; 
      position: relative; 
    }
    .slot { 
      padding:8px 10px; 
      border:1px solid var(--border); 
      border-radius:10px; 
      background:#fff; 
      cursor:pointer; 
      text-align:center; 
      font-size:0.9rem; 
      position: relative;
    }
    .slot.busy { 
      background:#fee2e2; 
      border-color:#fecaca; 
      color:#991b1b; 
      cursor:not-allowed; 
    }
    .slot.busy:hover::after {
      content: "Уже занято";
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      background: #1e293b;
      color: white;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      white-space: nowrap;
      z-index: 10;
      margin-bottom: 5px;
    }
    .slot.off { 
      background:#f1f5f9; 
      color:#94a3b8; 
      cursor:not-allowed; 
    }
    .slot.past { 
      background:#f1f5f9; 
      border-color:#cbd5e1; 
      color:#64748b; 
      cursor:not-allowed; 
      text-decoration: line-through;
    }
    .slot.past:hover::after {
      content: "Время уже прошло";
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      background: #1e293b;
      color: white;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      white-space: nowrap;
      z-index: 10;
      margin-bottom: 5px;
    }
    .slot.free:hover { 
      background: var(--primary-weak); 
      border-color: var(--primary); 
    }
    .slot.selected { 
      background: var(--primary); 
      border-color: var(--primary); 
      color:#fff; 
    }

    .svc-price { font-size:1.6rem; font-weight:800; }
    .svc-meta { color:var(--muted); }

    .alert { background:#fff7ed; border:1px solid #fed7aa; color:#9a3412; padding:10px 12px; border-radius:10px; margin-top:10px; }
    .debug-info { font-size:0.8rem; color:#64748b; margin-top:5px; display:none; }

    /* ===== СТИЛИ ДЛЯ TEXTAREA КОММЕНТАРИЯ ===== */
    textarea#comment {
      resize: vertical;        /* Разрешаем растягивать только вниз */
      min-height: 80px;        /* Минимальная высота */
      max-height: 300px;       /* Максимальная высота, чтобы не сломать вёрстку */
      width: 100%;             /* Занимает всю ширину контейнера */
      line-height: 1.5;        /* Удобная высота строки */
    }
  </style>
</head>
<body id="page-service">
  <main class="container">
    <div class="card" id="svcCard">
      <div class="card-title">
        <div>
          <h1 id="svcTitle" style="margin-bottom:4px">Загрузка…</h1>
          <div class="svc-meta" id="svcMeta">—</div>
        </div>
        <div class="svc-price" id="svcPrice">—</div>
      </div>
      <p id="svcDesc" style="margin:0"></p>
      <div id="svcError" class="alert" style="display:none"></div>
      <div id="rescheduleNotice" class="alert" style="display:none"></div>
    </div>

    <section class="svc-wrap" style="margin-top:12px">
      <!-- Левая часть: календарь месяца + легенда -->
      <div class="cal card">
        <div class="cal-head">
          <button class="btn-secondary" id="prevMonth">‹</button>
          <div class="cal-title" id="calTitle">—</div>
          <button class="btn-secondary" id="nextMonth">›</button>
        </div>

        <div class="cal-grid" id="dowRow"></div>
        <div class="cal-grid" id="monthGrid" style="margin-top:6px"></div>

        <div class="cal-legend">
          <span><span class="cal-dot lg-free"></span> свободно</span>
          <span><span class="cal-dot lg-partial"></span> частично занято</span>
          <span><span class="cal-dot lg-busy"></span> занято</span>
          <span><span class="cal-dot lg-off"></span> нерабочий день</span>
        </div>
      </div>

      <!-- Правая часть: слоты дня + комментарий + оформить -->
      <div class="day-panel card">
        <div class="card-title">
          <h2 id="dayTitle">Выберите дату</h2>
          <button class="btn" id="makeOrder" disabled>Оформить заявку</button>
        </div>

        <div class="help">Свободные интервалы в выбранный день</div>
        <div class="slots" id="slots"></div>
        <div id="slotsDebug" class="debug-info"></div>

        <div class="form" style="margin-top:12px">
          <label for="comment">Комментарий к заявке (необязательно)</label>
          <textarea id="comment" class="input" rows="3" placeholder="Опишите проблему, адрес, предпочтения и т.д."></textarea>
        </div>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
  <script>
    const q = (s) => document.querySelector(s);
    const qa = (s) => document.querySelectorAll(s);

    // ===== локальные date utils
    const ruMonths = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
    
    function ymd(d) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }
    
    function pad(n) { return String(n).padStart(2, '0'); }

    // ===== state
    let me = null, service = null, availability = null, orderToReschedule = null;
    let monthCursor = new Date();
    monthCursor.setDate(1);
    let selectedDate = null;
    let selectedSlotISO = null;

    // кэш срезов слотов по датам: { 'YYYY-MM-DD': {slotMinutes, slots:[{start,end,status}] } }
    const slotsCache = {};

    document.addEventListener('DOMContentLoaded', init);

    async function init() {
      // читаем id услуги из query
      const u = new URL(location.href);
      const idParam = u.searchParams.get('id');
      if (!idParam) {
        showError("Не передан параметр услуги (?id). Вернитесь в каталог и выберите услугу.");
        return;
      }
      const serviceId = Number(idParam);
      const orderIdParam = u.searchParams.get('orderId');

      try { me = await API.getMe(); } catch {}

      if (orderIdParam) {
        try {
          orderToReschedule = await API.orders.get(Number(orderIdParam));
        } catch {
          showError('Не удалось загрузить заявку для переноса времени.');
          return;
        }

        if (!me || me.role !== 'client') {
          showError('Переназначать время может только клиент из своего личного кабинета.');
          return;
        }

        if (Number(orderToReschedule.serviceId) !== serviceId) {
          showError('Указанная заявка не относится к этой услуге.');
          return;
        }

        if (!['NEW', 'ACCEPTED'].includes(orderToReschedule.status)) {
          showError('Изменить время можно только у активной заявки.');
          return;
        }
      }

      // — услуга (с мягким фоллбеком: /services/:id → /services)
      try {
        service = await API.services.get(serviceId);
      } catch {
        const list = await API.services.list().catch(() => []);
        service = list.find(s => String(s.id) === String(serviceId));
      }
      if (!service) {
        showError("Не удалось загрузить услугу. Откройте её из каталога ещё раз.");
        return;
      }

      // карточка (БЕЗОПАСНОЕ отображение)
      const titleEl = q('#svcTitle');
      if (titleEl) titleEl.textContent = escapeHtml(service.title || 'Услуга');
      
      const descEl = q('#svcDesc');
      if (descEl) descEl.textContent = escapeHtml(service.description || '');
      
      const priceEl = q('#svcPrice');
      if (priceEl) priceEl.textContent = `${Number(service.price || 0).toFixed(2)} ₽`;
      
      try {
        const cats = await API.categories.list();
        const cat = cats.find(c => String(c.id) === String(service.categoryId));
        const metaEl = q('#svcMeta');
        if (metaEl) metaEl.textContent = `${cat ? escapeHtml(cat.name) : 'Категория'} • Мастер #${service.masterId}`;
      } catch {
        const metaEl = q('#svcMeta');
        if (metaEl) metaEl.textContent = `Мастер #${service.masterId}`;
      }

      // базовая доступность (для офф-дней в отсутствие сети, но реальную занятость берём из /slots)
      try {
        availability = await API.availability.get(service.masterId);
      } catch {
        availability = defaultAvailability();
      }

      if (orderToReschedule) {
        document.title = 'Переназначение времени — АГРУС';
        const makeOrderBtn = q('#makeOrder');
        if (makeOrderBtn) makeOrderBtn.textContent = 'Сохранить время';
        
        const commentInput = q('#comment');
        if (commentInput) commentInput.value = orderToReschedule.comment || '';
        
        const currentWhen = formatPseudoUtcDateTime(orderToReschedule.desired_datetime);
        const notice = q('#rescheduleNotice');
        if (notice) {
          notice.textContent = `Вы переносите существующую заявку. Текущее время: ${currentWhen}. Выберите новый свободный слот и сохраните изменения.`;
          notice.style.display = 'block';
        }
      }

      // подписи дней недели + первичная отрисовка месяца (с подгрузкой /slots)
      renderDOW();
      await renderMonth();

      const prevBtn = q('#prevMonth');
      if (prevBtn) prevBtn.onclick = async () => {
        monthCursor.setMonth(monthCursor.getMonth() - 1);
        await renderMonth();
      };
      
      const nextBtn = q('#nextMonth');
      if (nextBtn) nextBtn.onclick = async () => {
        monthCursor.setMonth(monthCursor.getMonth() + 1);
        await renderMonth();
      };
      
      const makeOrderBtn = q('#makeOrder');
      if (makeOrderBtn) makeOrderBtn.onclick = submitOrder;
    }

    function showError(text) {
      const errorEl = q('#svcError');
      if (errorEl) {
        errorEl.textContent = escapeHtml(text);
        errorEl.style.display = 'block';
      }
    }

    // ===== MONTH
    function renderDOW() {
      const dowRow = q('#dowRow');
      if (dowRow) {
        dowRow.innerHTML = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'].map(n => `<div class="cal-dow">${escapeHtml(n)}</div>`).join('');
      }
    }

    async function renderMonth() {
      // сброс правой панели
      selectedDate = null;
      selectedSlotISO = null;
      
      const dayTitle = q('#dayTitle');
      if (dayTitle) dayTitle.textContent = 'Выберите дату';
      
      const makeOrderBtn = q('#makeOrder');
      if (makeOrderBtn) makeOrderBtn.disabled = true;
      
      const slotsDiv = q('#slots');
      if (slotsDiv) slotsDiv.innerHTML = '';

      const y = monthCursor.getFullYear(), m = monthCursor.getMonth();
      const calTitle = q('#calTitle');
      if (calTitle) calTitle.textContent = `${ruMonths[m]} ${y}`;

      const first = new Date(y, m, 1);
      const last = new Date(y, m + 1, 0);
      const firstDow = (first.getDay() + 6) % 7; // Пн=0, Вс=6

      // заранее загрузим /slots для всех дней месяца (кэш), чтобы окрасить busy/partial/free
      const days = [];
      for (let d = 1; d <= last.getDate(); d++) {
        days.push(ymd(new Date(y, m, d)));
      }
      const toLoad = days.filter(k => !slotsCache[k]);
      if (toLoad.length) {
        await Promise.all(toLoad.map(async (k) => {
          try {
            slotsCache[k] = await API.availability.slots(service.masterId, k);
          } catch (error) {
            console.warn(`Не удалось загрузить слоты для ${k}:`, error);
            slotsCache[k] = { slotMinutes: availability.slotMinutes || 30, slots: [] };
          }
        }));
      }

      const grid = q('#monthGrid');
      if (!grid) return;
      grid.innerHTML = '';

      // пустые ячейки до первого числа
      for (let i = 0; i < firstDow; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'cal-cell disabled';
        grid.appendChild(emptyCell);
      }

      // сами дни
      for (let day = 1; day <= last.getDate(); day++) {
        const dt = new Date(y, m, day);
        const key = ymd(dt);
        const summary = summarizeDay(slotsCache[key]);

        const cell = document.createElement('div');
        cell.className = 'cal-cell';
        if (summary === 'off') cell.classList.add('disabled');
        if (summary === 'busy') cell.classList.add('busy');
        if (summary === 'partial') cell.classList.add('partial');

        const numSpan = document.createElement('span');
        numSpan.className = 'num';
        numSpan.textContent = day;
        cell.appendChild(numSpan);

        if (summary !== 'off') {
          cell.addEventListener('click', () => selectDay(dt));
        }
        grid.appendChild(cell);
      }
    }

    function summarizeDay(dayObj) {
      const arr = (dayObj && Array.isArray(dayObj.slots)) ? dayObj.slots : [];
      if (arr.length === 0) return 'off';
      let free = 0, busy = 0;
      for (const s of arr) {
        const isPast = s.status === 'free' && isPseudoUtcValueInPast(s.start);
        if (s.status === 'busy' || isPast) busy++;
        else free++;
      }
      if (free === 0 && busy > 0) return 'busy';
      if (free > 0 && busy > 0) return 'partial';
      if (free > 0 && busy === 0) return 'free';
      return 'off';
    }

    // ===== DAY VIEW - БЕЗОПАСНАЯ ВЕРСИЯ
    async function selectDay(date) {
      selectedDate = date;
      selectedSlotISO = null;

      // Форматируем дату для отображения
      const day = date.getDate().toString().padStart(2, '0');
      const month = ruMonths[date.getMonth()].toLowerCase();
      const year = date.getFullYear();
      
      const dayTitle = q('#dayTitle');
      if (dayTitle) dayTitle.textContent = `${day} ${escapeHtml(month)} ${year}`;
      
      const makeOrderBtn = q('#makeOrder');
      if (makeOrderBtn) makeOrderBtn.disabled = true;

      const key = ymd(date);
      if (!slotsCache[key]) {
        try {
          slotsCache[key] = await API.availability.slots(service.masterId, key);
        } catch (error) {
          console.error('Ошибка загрузки слотов:', error);
          slotsCache[key] = { slotMinutes: availability.slotMinutes || 30, slots: [] };
        }
      }

      const data = slotsCache[key];
      const box = q('#slots');
      if (!box) return;
      box.innerHTML = '';

      if (!data.slots || data.slots.length === 0) {
        box.innerHTML = `<div class="empty">В этот день мастер не работает.</div>`;
        return;
      }

      // Сортируем слоты по времени начала
      const sortedSlots = [...data.slots].sort((a, b) =>
        getPseudoUtcComparableTimestamp(a.start) - getPseudoUtcComparableTimestamp(b.start)
      );

      const availableFutureSlots = sortedSlots.filter(s => s.status === 'free' && !isPseudoUtcValueInPast(s.start));

      if (availableFutureSlots.length === 0) {
        box.innerHTML = `<div class="empty">На выбранный день нет свободных будущих интервалов.</div>`;
      }

      // Показываем все слоты
      sortedSlots.forEach(s => {
        const isPast = s.status === 'free' && isPseudoUtcValueInPast(s.start);
        const label = formatPseudoUtcTimeRange(s.start, s.end);

        const slotBtn = document.createElement('button');
        slotBtn.className = `slot ${isPast ? 'past' : s.status}`;
        slotBtn.textContent = label;
        slotBtn.dataset.start = s.start;
        slotBtn.dataset.end = s.end;

        if (s.status === 'busy') {
          slotBtn.disabled = true;
          slotBtn.title = 'Этот слот уже занят';
        } else if (isPast) {
          slotBtn.disabled = true;
          slotBtn.title = 'Прошедшее время недоступно для записи';
        } else {
          slotBtn.addEventListener('click', () => {
            document.querySelectorAll('#slots .slot').forEach(x => x.classList.remove('selected'));
            slotBtn.classList.add('selected');
            selectedSlotISO = s.start;
            const makeOrderBtn = q('#makeOrder');
            if (makeOrderBtn) makeOrderBtn.disabled = false;

            console.log('Выбран слот:', {
              start: s.start,
              end: s.end,
              localTime: label
            });
          });
        }
        box.appendChild(slotBtn);
      });
    }

    function human(d) {
      return `${String(d.getDate()).padStart(2, '0')} ${ruMonths[d.getMonth()].toLowerCase()} ${d.getFullYear()}`;
    }

    // ===== submit - БЕЗОПАСНАЯ ВЕРСИЯ
    async function submitOrder() {
      if (!selectedSlotISO) {
        alert('Выберите время для заявки');
        return;
      }

      try {
        const currentUser = await API.getMe().catch(() => null);
        if (!currentUser) {
          location.href = '/login.html?mode=login';
          return;
        }
        if (currentUser.role !== 'client') {
          alert('Для оформления заявки войдите как клиент.');
          return;
        }

        const commentInput = q('#comment');
        const comment = (commentInput?.value || '').trim();

        if (isPseudoUtcValueInPast(selectedSlotISO)) {
          alert('Нельзя создать заявку на прошедшее время. Выберите свободный будущий слот.');
          if (selectedDate) await selectDay(selectedDate);
          return;
        }

        console.log('Отправка заказа:', {
          serviceId: service.id,
          desired_datetime: selectedSlotISO,
          comment: comment
        });

        let result;
        if (orderToReschedule) {
          result = await API.orders.reschedule(orderToReschedule.id, selectedSlotISO, comment);
          alert('✅ Время заявки успешно изменено.');
        } else {
          result = await API.orders.create(service.id, selectedSlotISO, comment);
          alert('✅ Заявка создана! Отслеживать можно в «ЛК клиента → Мои заказы».');
        }

        await window.AGRUS?.refreshNotifications?.();
        location.href = `/client.html?tab=orders${result?.id ? `&orderId=${result.id}` : ''}`;
      } catch (e) {
        console.error('Ошибка создания заказа:', e);

        // Показываем более информативное сообщение об ошибке
        let errorMessage = 'Не удалось создать заявку.';

        if (e?.details) {
          if (e.details.code === 'SLOT_UNAVAILABLE') {
            errorMessage = 'Этот слот уже занят. Обновите календарь и выберите другой.';
          } else if (e.details.code === 'SLOT_NOT_IN_SCHEDULE') {
            errorMessage = 'Выбранное время вне рабочего графика мастера.';
          } else if (e.details.code === 'PAST_TIME') {
            errorMessage = orderToReschedule
              ? 'Нельзя переназначить заявку на прошедшее время.'
              : 'Нельзя создать заявку на прошедшее время.';
          } else if (e.details.error) {
            errorMessage = `Ошибка: ${e.details.error}`;
          }
        }

        alert(errorMessage);
      }
    }

    // Функция для отладки - можно вызвать из консоли
    window.debugSlots = function(masterId, date) {
      if (!masterId) masterId = service?.masterId;
      if (!date) date = ymd(new Date());

      fetch(`/api/availability/${masterId}/slots?date=${date}`)
        .then(r => r.json())
        .then(data => {
          console.log('Слоты от сервера:', data);
          alert('Смотри консоль браузера (F12)');
        })
        .catch(err => console.error(err));
    };
  </script>
</body>
</html>
