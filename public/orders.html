<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Заказы — АГРУС</title>
  <link rel="stylesheet" href="/styles.css"/>
</head>
<body id="page-orders">
  <main class="container">
    <h1 id="title">Заказы</h1>
    <div id="orderGrid" class="card-grid"></div>
  </main>
  <script src="/app.js"></script>
  <script>
    const q = s => document.querySelector(s);
    const grid = q('#orderGrid');
    const title = q('#title');
    let me = null;

    function createButton(text, className, onClick) {
      const btn = document.createElement('button');
      btn.className = className;
      btn.textContent = text;
      btn.onclick = onClick;
      return btn;
    }

    function item(order) {
      const card = document.createElement('div');
      card.className = 'card';
      
      const infoDiv = document.createElement('div');
      infoDiv.className = 'info';
      
      const titleH3 = document.createElement('h3');
      titleH3.textContent = `Заказ #${order.id}`;
      
      const statusP = document.createElement('p');
      statusP.innerHTML = `Статус: <strong>${escapeHtml(statusLabel(order.status))}</strong>`;
      
      const dateP = document.createElement('p');
      dateP.className = 'help';
      dateP.textContent = order.desired_datetime ? formatPseudoUtcDateTime(order.desired_datetime) : 'Дата не указана';
      
      const actionsDiv = document.createElement('div');
      actionsDiv.className = 'row actions';
      
      if (me.role === 'master') {
        if (order.status === 'NEW') {
          const acceptBtn = createButton('Принять', 'btn-secondary', () => updateOrder(order.id, 'ACCEPTED'));
          const rejectBtn = createButton('Отклонить', 'btn-danger', () => {
            const reason = prompt('Причина отказа:') || '';
            updateOrder(order.id, 'REJECTED', reason);
          });
          actionsDiv.appendChild(acceptBtn);
          actionsDiv.appendChild(rejectBtn);
        } else if (order.status === 'ACCEPTED') {
          const doneBtn = createButton('Выполнено', 'btn-secondary', () => updateOrder(order.id, 'DONE'));
          actionsDiv.appendChild(doneBtn);
        }
      } else if (order.status === 'NEW' || order.status === 'ACCEPTED') {
        const cancelBtn = createButton('Отменить', 'btn-danger', () => updateOrder(order.id, 'CANCELLED'));
        actionsDiv.appendChild(cancelBtn);
      }
      
      const detailsBtn = createButton('Подробнее', 'btn-secondary', () => openDetails(order));
      actionsDiv.appendChild(detailsBtn);
      
      infoDiv.appendChild(titleH3);
      infoDiv.appendChild(statusP);
      infoDiv.appendChild(dateP);
      infoDiv.appendChild(actionsDiv);
      card.appendChild(infoDiv);
      
      return card;
    }

    async function updateOrder(id, status, reason = '') {
      try {
        await API.orders.setStatus(id, status, reason);
        await window.AGRUS?.refreshNotifications?.();
        await loadOrders();
      } catch {
        alert('Нельзя выполнить это действие.');
      }
    }

    function openDetails(order) {
      if (me.role === 'master') {
        location.href = `/master.html?tab=orders&orderId=${order.id}`;
      } else {
        location.href = `/client.html?tab=orders&orderId=${order.id}`;
      }
    }

    async function loadOrders() {
      try {
        me = await API.getMe();
        if (title) title.textContent = me.role === 'master' ? 'Заказы мастера' : 'Мои заказы';
        
        const ordersList = await API.orders.list();
        if (grid) {
          grid.innerHTML = '';
          if (!ordersList.length) {
            grid.innerHTML = '<div class="empty">Пока нет заказов</div>';
            return;
          }
          ordersList.forEach(order => grid.appendChild(item(order)));
        }
      } catch {
        location.href = '/login.html?mode=login';
      }
    }

    document.addEventListener('DOMContentLoaded', loadOrders);
  </script>
</body>
</html>
